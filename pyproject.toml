[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openarm-datacollection"
version = "0.1.0"
description = "Teleoperation data collection pipeline for OpenArm 2.0"
requires-python = ">=3.11"
dependencies = [
  "python-can>=4.3",
  "h5py>=3.10",
  "numpy>=1.26",
  "opencv-python>=4.9",
  "pyudev>=0.24",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
zed = ["pyzed"]
lerobot = ["lerobot"]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hardware*", "cameras*", "recording*", "api*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
